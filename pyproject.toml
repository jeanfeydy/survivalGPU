[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "survivalgpu"
authors = [
    { name = "Jean Feydy", email = "jean.feydy@gmail.com" },
    { name = "Antoine Poirot-Bourdain", email = "antoine.poirot.bourdain@gmail.com"},
    { name = "Alexis van Straaten", email = "alexis.vanstraaten@outlook.fr"}
]
dynamic = ["version"]
description = "Survival analysis with GPU acceleration"
readme = "python/README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">= 3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib",
  "torch>=2.2",
  "pykeops",
  "beartype",
  "jaxtyping",
  "pandas",
  "scipy",
]
keywords = [
  "survival analysis",
  "GPU",
  "machine learning",
  "pykeops",
  "torch",
  "numpy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[dependency-groups]
test = [
  "rpy2",
  "black",
  "flake8",
  "hypothesis",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-sphinx @ git+https://github.com/jeanfeydy/pytest-sphinx.git",
]



all = [{include-group = "test"}] # https://stackoverflow.com/questions/75490231/pip-pyproject-toml-can-optional-dependency-groups-require-other-optional-depend


[project.urls]
Documentation = "https://github.com/jeanfeydy/survivalGPU"
Repository = "https://github.com/jeanfeydy/survivalGPU"


[tool.setuptools.dynamic]
version = {attr = "survivalgpu.__version__"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["survivalgpu"]
namespaces = false

[tool.black]
line-length = 79

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "--cov=survivalgpu",
    "--doctest-modules",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--color=yes",
    ]
xfail_strict = true
filterwarnings = [
  "error",
]
log_cli_level = "info"
testpaths = [
  "python/tests",
  "python/survivalgpu",
]

[tool.repo-review]
ignore = [
    "PY004", # explicit doc/ folder
    "PY005", # explicit test/ folder
    "PY007", # nox or tox
    "PC140", # MyPy
    "PC170", # PyGrep (because no rst files)
    "PC180", # Prettier
    "MY", # MyPy
    "RTD", # ReadTheDocs
    ]


# See: https://learn.scientific-python.org/development/guides/style/#PC190
[tool.ruff]
src = ["python/survivalgpu"]

[tool.ruff.lint]
extend-select = [
  "B",        # flake8-bugbear
  "I",        # isort
  "ARG",      # flake8-unused-arguments
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "ICN",      # flake8-import-conventions
  "G",        # flake8-logging-format
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  "T20",      # flake8-print
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
  "EXE",      # flake8-executable
  "NPY",      # NumPy specific rules
  "FURB",     # refurb
  "PYI",      # flake8-pyi
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
  "PYI041",   # Use `float` instead of `int | float
  "RET505",   # Unnecessary `elif`/`else` after `return` statement
  "C408",     # Allow for dict(a=1) instead of {"a": 1}
  "F722",     # Allow type annotations "a b" in jaxtyping
  "E741",     # Allow "I" as a variable name
  "F821",   # TODO: DIRTY WORKAROUND https://github.com/astral-sh/ruff/issues/17386
  "T201",   # TODO: print statements
]
typing-modules = ["survivalgpu.typecheck"]

[tool.ruff.lint.per-file-ignores]
# For _init__.py files:
"**_init__.py**" = ["F401", "F403", "F405"]
# F401: imported but unused
# F403: unable to detect undefined names (import *)
# F405: may be undefined, or defined from star imports

# For examples gallery files:
"**examples/**" = [
  "T201",  # print statements
  "RUF003",
  "E402",
  ]
# RUF003: Ambiguous no-break spaces
# E402: module level import not at top of file


[tool.codespell]
# Ignore the following words:
ignore-words-list = [
  "calculs",
  "parm",
  "constrasts",
]
