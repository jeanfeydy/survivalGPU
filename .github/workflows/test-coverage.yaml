# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# R test coverage via covr. The R tests call the Python `survivalgpu` package
# through reticulate, so the Python package + its dependencies must be
# importable by the interpreter reticulate uses (see the pip install + the
# RETICULATE_PYTHON wiring below).
name: R test coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::dplyr
          needs: coverage
          working-directory: "R/"

      - name: Install the Python package and point reticulate at it
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .
          # Make reticulate use THIS interpreter (where survivalgpu + deps live),
          # and help PyKeOps find pybind11's headers when it JIT-compiles.
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "CPATH=$(python -c 'import pybind11; print(pybind11.get_include())'):${CPATH}" >> "$GITHUB_ENV"
        shell: bash

      - name: Test coverage
        run: |
          covr::codecov(
            path = "R/",
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
