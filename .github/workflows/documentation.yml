# Builds the unified R + Python documentation site (docs/). On pull request
# and push to main, builds it as a test (with an uploaded artifact) but does
# not publish it. On release or manual trigger, builds and publishes it to
# GitHub Pages.

name: Documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PYKEOPS_VERBOSE: "0"
      KEOPS_VERBOSE: "0"

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies (the package itself, + pkgdown/knitr/rmarkdown/survminer)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::survminer
            local::R/
          needs: website
          working-directory: "R/"

      - name: Install Python dependencies (survivalgpu[wce] + docs toolchain)
        run: |
          pip install --upgrade pip
          pip install ".[wce]" --group test
          pip install -r docs/requirements_docs.txt
          # Point reticulate at this interpreter instead of letting it
          # auto-provision its own bare ephemeral Python -- same recipe as
          # R-CMD-check.yaml.
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Build documentation (knit R pages, sphinx-build, pkgdown)
        run: bash docs/build_docs.sh

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          force_orphan: true
