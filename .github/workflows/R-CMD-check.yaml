# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R CMD check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Installs the 'wce' extra (pykeops) everywhere, so this job exercises
  # test-wceGPU.R for real -- on Linux and macOS, since pykeops isn't
  # available on Windows at all (see R-CMD-check-no-wce below for that).
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R (BLAS/LAPACK) and PyTorch (loaded via reticulate) each bundle their
      # own OpenMP runtime; on macOS loading both into the same process
      # aborts with "OMP: Error #15: ... libomp.dylib already initialized".
      KMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install OpenMP (macOS/Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          # pykeops JIT-compiles its kernels and needs libomp on Apple
          # Silicon; without it, keopscore disables OpenMP and falls back
          # to a much less-tested code path that can crash.
          brew install libomp

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip' # caching pip dependencies

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[wce]" --group test
          # Point reticulate at this interpreter instead of letting it
          # auto-provision its own bare ephemeral Python.
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: R CMD CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"

  # Installs Python/torch but deliberately NOT the 'wce' extra (pykeops),
  # on Linux, macOS AND Windows (pykeops can't install there anyway, so
  # this is the only way to cover Windows at all). coxphGPU() tests must
  # pass; wceGPU() tests must skip gracefully with a warning instead of
  # erroring -- see R/tests/testthat/helper-keops.R.
  R-CMD-check-no-wce:
    runs-on: ${{ matrix.os }}

    name: no-wce (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      KMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: Install Python dependencies (without the 'wce' extra)
        shell: bash
        run: |
          pip install --upgrade pip
          pip install . --group test
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: R CMD CHECK (no pykeops)
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"

  # Simulates a CRAN check machine: no Python/torch/pykeops installed at
  # all (these runners' stock Python has none of it). Exported functions
  # must fail gracefully at runtime instead of crashing, and
  # Python-dependent tests/vignettes must skip instead of erroring -- see
  # R/CRAN_CHECKLIST.md Phase 0. No Python is installed in this job at
  # all, so unlike R-CMD-check above, there's no pykeops/libomp concern
  # here -- that's exactly why Windows can be included here even though
  # the package's real GPU functionality doesn't support it (see
  # README.md): this job never touches that code path.
  R-CMD-check-no-python:
    runs-on: ${{ matrix.os }}

    name: no-python (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: R CMD CHECK (no Python/torch/pykeops installed)
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"
