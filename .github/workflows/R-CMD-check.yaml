# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R CMD check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R (BLAS/LAPACK) and PyTorch (loaded via reticulate) each bundle their
      # own OpenMP runtime; on macOS loading both into the same process
      # aborts with "OMP: Error #15: ... libomp.dylib already initialized".
      KMP_DUPLICATE_LIB_OK: "TRUE"

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip' # caching pip dependencies

      - name: Install OpenMP (macOS/Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          # pykeops JIT-compiles its kernels and needs libomp on Apple
          # Silicon; without it, keopscore disables OpenMP and falls back
          # to a much less-tested code path that has crashed with a
          # segfault during `R CMD check` on macOS-arm64 runners. keopscore
          # detects it via `brew --prefix`/opt/libomp itself at runtime, so
          # installing the formula is the whole fix -- no extra
          # CFLAGS/LDFLAGS needed.
          brew install libomp

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install . --group test
          # Point reticulate at this interpreter instead of letting it
          # auto-provision its own bare ephemeral Python.
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: R CMD CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"

  # Simulates a CRAN check machine: no Python/torch/pykeops installed at
  # all (this runner's stock python3 has neither). Exported functions must
  # fail gracefully at runtime instead of crashing, and Python-dependent
  # tests/vignettes must skip instead of erroring -- see
  # R/CRAN_CHECKLIST.md Phase 0.
  R-CMD-check-no-python:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: R CMD CHECK (no Python/torch/pykeops installed)
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"
