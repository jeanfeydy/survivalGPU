# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R CMD check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Known issue, not blocking: `R CMD check`'s test step reliably
    # segfaults on macos-latest inside a real coxphGPU() call
    # (torch.tensor() construction, deep in PyTorch's native code),
    # every time, deterministically, regardless of R/Python involvement
    # specifics. Investigated extensively (OpenMP/libomp, Python
    # interpreter identity, numpy/torch version floors) without
    # resolving it -- see R/CRAN_WORK_LOG.md, "macOS segfault" entries,
    # for the full investigation and what was ruled out. Not blocking
    # CRAN readiness: CRAN's own check machines never have Python/torch
    # installed either way, and R-CMD-check-no-python's macOS entry
    # (which mirrors that) passes. Revisit with real macOS hardware and
    # a debugger if this needs solving properly.
    continue-on-error: ${{ matrix.config.os == 'macos-latest' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R (BLAS/LAPACK) and PyTorch (loaded via reticulate) each bundle their
      # own OpenMP runtime; on macOS loading both into the same process
      # aborts with "OMP: Error #15: ... libomp.dylib already initialized".
      KMP_DUPLICATE_LIB_OK: "TRUE"
      # CPython's faulthandler dumps a Python-level traceback to stderr on
      # a native crash (segfault included) -- left on since it's what
      # produced the only useful diagnostics for the known macOS issue
      # above; harmless elsewhere.
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip' # caching pip dependencies

      - name: Install OpenMP (macOS/Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          # pykeops JIT-compiles its kernels and needs libomp on Apple
          # Silicon; without it, keopscore disables OpenMP and falls back
          # to a much less-tested code path. keopscore detects it via
          # `brew --prefix`/opt/libomp itself at runtime, so installing
          # the formula is the whole fix -- no extra CFLAGS/LDFLAGS
          # needed.
          brew install libomp

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install . --group test
          # Point reticulate at this interpreter instead of letting it
          # auto-provision its own bare ephemeral Python.
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: R CMD CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"

  # Simulates a CRAN check machine: no Python/torch/pykeops installed at
  # all (these runners' stock Python has none of it). Exported functions
  # must fail gracefully at runtime instead of crashing, and
  # Python-dependent tests/vignettes must skip instead of erroring -- see
  # R/CRAN_CHECKLIST.md Phase 0. No Python is installed in this job at
  # all, so unlike R-CMD-check above, there's no pykeops/libomp concern
  # here -- that's exactly why Windows can be included here even though
  # the package's real GPU functionality doesn't support it (see
  # README.md): this job never touches that code path.
  R-CMD-check-no-python:
    runs-on: ${{ matrix.os }}

    name: no-python (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: R CMD CHECK (no Python/torch/pykeops installed)
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"
