# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R CMD check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R (BLAS/LAPACK) and PyTorch (loaded via reticulate) each bundle their
      # own OpenMP runtime; on macOS loading both into the same process
      # aborts with "OMP: Error #15: ... libomp.dylib already initialized".
      KMP_DUPLICATE_LIB_OK: "TRUE"
      # Diagnostic only (not a fix): on a native crash (segfault included),
      # CPython's faulthandler dumps a Python-level traceback to stderr
      # showing which Python/C call was actually in progress. Investigating
      # a macOS-only segfault in `R CMD check`'s test step that gave no
      # further detail in R's own crash handler output -- see
      # R/CRAN_WORK_LOG.md, "Fix macOS CI segfault" entries.
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip' # caching pip dependencies

      - name: Install OpenMP (macOS/Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          # pykeops JIT-compiles its kernels and needs libomp on Apple
          # Silicon; without it, keopscore disables OpenMP and falls back
          # to a much less-tested code path that has crashed with a
          # segfault during `R CMD check` on macOS-arm64 runners. keopscore
          # detects it via `brew --prefix`/opt/libomp itself at runtime, so
          # installing the formula is the whole fix -- no extra
          # CFLAGS/LDFLAGS needed.
          brew install libomp

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: Install Python dependencies
        env:
          PY: ${{ steps.setup-python.outputs.python-path }}
        run: |
          # Use the exact interpreter setup-python resolved (via its own
          # python-path output), invoked with -m pip, rather than bare
          # `pip`/`python` on PATH. macOS runner images ship pre-installed
          # framework Pythons alongside whatever setup-python provisions
          # into its hosted tool cache; bare `pip` and bare `python` are
          # independent PATH lookups that aren't guaranteed to resolve to
          # the same interpreter, especially there. If they diverge here,
          # torch/pykeops get installed into one interpreter's
          # site-packages while RETICULATE_PYTHON below points reticulate
          # at a different one -- loading a mismatched libpython against
          # natively-linked extensions built for a different one is
          # exactly the kind of thing that produces a hard-to-diagnose
          # native crash rather than a clean Python-level error.
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install . --group test
          echo "RETICULATE_PYTHON=$PY" >> "$GITHUB_ENV"
          # Diagnostic: numpy/torch are unpinned upstream in pyproject.toml
          # (beyond the floors just added), so print exactly what got
          # resolved on this platform -- a NumPy/PyTorch ABI mismatch is a
          # common cause of segfaults inside torch.tensor(numpy_array),
          # which is where the macOS crash under investigation happens.
          "$PY" -c "import numpy, torch; print('numpy', numpy.__version__); print('torch', torch.__version__)"

      - name: R CMD CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"

  # Simulates a CRAN check machine: no Python/torch/pykeops installed at
  # all (these runners' stock Python has none of it). Exported functions
  # must fail gracefully at runtime instead of crashing, and
  # Python-dependent tests/vignettes must skip instead of erroring -- see
  # R/CRAN_CHECKLIST.md Phase 0. No Python is installed in this job at
  # all, so unlike R-CMD-check above, there's no pykeops/libomp concern
  # here -- that's exactly why Windows can be included here even though
  # the package's real GPU functionality doesn't support it (see
  # README.md): this job never touches that code path.
  R-CMD-check-no-python:
    runs-on: ${{ matrix.os }}

    name: no-python (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: "R/"

      - name: R CMD CHECK (no Python/torch/pykeops installed)
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          working-directory: "R/"
