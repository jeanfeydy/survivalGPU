# Install survivalGPU with its test dependencies, run the Python test suite,
# and upload coverage to Codecov.
#
# The suite compares survivalGPU against the reference R packages `survival`
# and `WCE` through rpy2, so this job needs a working R + rpy2 pairing.
# IMPORTANT: modern rpy2 (>= 3.6) links against R's `R_getVar` symbol, which
# only exists in R >= 4.5.0. Pinning an older R (e.g. 4.4.x) makes rpy2 fail to
# import with `undefined symbol: R_getVar`, which breaks pytest collection.
name: Python tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup R (>= 4.5 -- required by modern rpy2 for the R_getVar symbol)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install R reference packages (survival, WCE)
        run: |
          Rscript -e 'install.packages(c("survival", "WCE"), repos = "https://cloud.r-project.org")'
        shell: bash

      - name: Install package with test extras (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[test]

      - name: Wire rpy2 <-> R and PyKeOps headers (persist across steps)
        run: |
          # Each `run:` is a fresh shell, so `export` would be lost before the
          # test step. Persist through $GITHUB_ENV instead.
          # LD_LIBRARY_PATH: lets rpy2 find libR.so at import time (rpy2 issue #1164).
          echo "LD_LIBRARY_PATH=$(python -m rpy2.situation LD_LIBRARY_PATH):${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          # CPATH: lets PyKeOps find pybind11's headers when it JIT-compiles.
          echo "CPATH=$(python -c 'import pybind11; print(pybind11.get_include())'):${CPATH}" >> "$GITHUB_ENV"

      - name: Sanity check -- rpy2 imports and talks to R
        run: |
          python -c "import rpy2.robjects as ro; print(ro.r('R.version.string')[0])"

      - name: Run tests
        run: |
          python -m pytest

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
