# Verify that the survivalgpu package installs cleanly from pyproject.toml
# and imports on a CPU-only runner, across the supported Python versions.
# This job intentionally installs ONLY the core package (no test extras, no R):
# it is the fast "does it install?" gate. The actual test suite lives in
# python-tests.yml.
name: Python install

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is intentionally left out until torch + pykeops publish wheels
        # for it; add it back once they do.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package from pyproject.toml (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only: avoids pulling the multi-GB CUDA stack on runners
          # that have no GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .

      - name: Show what was installed
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip list

      - name: Import smoke test
        run: |
          python -c "import survivalgpu; print('import OK -', survivalgpu.__version__, survivalgpu.__file__)"
