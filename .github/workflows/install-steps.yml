# Runs the installation steps of the docs (docs/source/r/installation.md)
# exactly as a user would: no checkout, no `pip install`, no
# RETICULATE_PYTHON. The R package is installed from GitHub at the tested
# commit, reticulate picks a Python and creates the 'survivalGPU' virtualenv,
# then a new R session fits a CoxPH model (and a WCE model, except on
# Windows) -- so the job fails as soon as the documented installation breaks.
# Keep these steps in sync with the docs.
#
# This complements R-CMD-check.yaml, which installs the Python package with
# `pip install .` into site-packages: there, reticulate::import_from_path()
# silently falls back to that copy if the R package's bundled Python code
# (R/inst/python, a symlink) didn't survive the install. Users don't have
# that fallback; this job doesn't either.

name: Install steps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  install-steps:
    runs-on: ${{ matrix.os }}

    name: install steps (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Install the commit of this run (the pull request's head, which may
      # live in a fork), rather than the docs' default branch:
      SURVIVALGPU_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SURVIVALGPU_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Documented prerequisite for the WCE model on macOS. (Rtools on Windows
      # and the Xcode command line tools on macOS, the other documented
      # prerequisites, are already on the runners.)
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install (docs steps 2 and 3)
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github(Sys.getenv("SURVIVALGPU_REPO"), subdir = "R",
                                  ref = Sys.getenv("SURVIVALGPU_REF"))

          library(reticulate)
          virtualenv_create("survivalGPU", version = ">=3.10")
          virtualenv_install("survivalGPU", c("numpy", "torch", "pandas", "scipy",
                                              "matplotlib", "beartype", "jaxtyping"))
          if (.Platform$OS.type != "windows") {
            virtualenv_install("survivalGPU", "pykeops")
          }

          # Only for the check below, not a user step:
          install.packages("WCE")

      - name: Use it (docs step 4, in a new R session)
        shell: Rscript {0}
        run: |
          library(reticulate)
          use_virtualenv("survivalGPU")

          library(survivalGPU)
          library(survival)
          print(use_cuda())

          fit <- coxphGPU(Surv(time, status) ~ age + sex, data = lung)
          print(coef(fit))

          if (.Platform$OS.type != "windows") {
            data(drugdata, package = "WCE")
            wce <- wceGPU(data = drugdata, nknots = 1, cutoff = 90, id = "Id",
                          event = "Event", start = "Start", stop = "Stop",
                          expos = "dose", covariates = c("age", "sex"))
            print(wce$WCEmat[1, 1:5])
          }
